<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice Board</title>
  <link rel="stylesheet" href="default.css">
  <script src="https://cdn.jsdelivr.net/npm/@basementuniverse/jsonpad-sdk@2.2.0/build/jsonpad-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@basementuniverse/jsonpad-realtime-sdk@1.6.0/build/jsonpad-realtime-sdk.js"></script>
</head>
<body>
  <header class="toolbar">
    <h1>Notice Board</h1>
    <p class="hint">Click anywhere to add a note. Drag a note by its top edge.</p>
    <div class="palette" title="The colour of the notes you add"></div>
    <p class="connection"></p>
  </header>

  <p class="setup hidden">
    This copy of the sample hasn't been set up yet. Follow the steps in
    <code>README.md</code>, then paste your token into <code>config.js</code>.
  </p>

  <main class="board"></main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
